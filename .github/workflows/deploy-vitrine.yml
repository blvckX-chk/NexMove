name: Déploiement vitrine (Cloudflare)

# Publication de SECOURS de la vitrine (web/) sur Cloudflare Workers, lancée à la main
# (onglet Actions > Run workflow). La publication normale est faite par le build Git
# intégré de Cloudflare à chaque merge sur main.
# Secrets requis (Settings > Secrets and variables > Actions) :
#   CLOUDFLARE_API_TOKEN   jeton API avec le modèle « Edit Cloudflare Workers »
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte (visible dans l'URL du tableau de bord)
on:
  workflow_dispatch:

concurrency:
  group: deploy-vitrine
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans les secrets du dépôt."
            exit 1
          fi

      - name: Marqueur de version (vérifiable sur /version.txt)
        run: |
          printf "NexMove vitrine\ncommit %s\npublié le %s UTC\n" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d %H:%M')" > web/version.txt
          cat web/version.txt

      - name: Publier sur Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Vérifier le site en ligne
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" https://nexmove.blvckunlimited.space/)
          echo "Accueil : HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Le site ne répond pas 200 après déploiement."; exit 1; }
          curl -s -o /dev/null -w "Page 404 de marque : HTTP %{http_code}\n" https://nexmove.blvckunlimited.space/page-inexistante
          echo "Version en ligne :"; curl -s https://nexmove.blvckunlimited.space/version.txt
