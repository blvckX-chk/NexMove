name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest ruff

      - name: Ruff (lint léger — errors only)
        # On ne bloque pas encore sur le style, seulement sur les vraies erreurs
        run: ruff check api/ --select=E9,F63,F7,F82 --output-format=github

      - name: Compile (tous les modules Python de api/)
        run: python -m compileall -q api/

      - name: Tests unitaires
        env:
          FORGE_NEX_API_KEY: ci-test-key
        run: python -m pytest tests/ -q
