name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest ruff

      - name: Ruff (lint léger — errors only)
        run: ruff check api/ --select=E9,F63,F7,F82 --output-format=github

      - name: Compile (tous les modules Python de api/)
        run: python -m compileall -q api/

      - name: Tests unitaires
        env:
          FORGE_NEX_API_KEY: ci-test-key
        run: python -m pytest tests/ -q

  # ─── Test d'intégration Docker : attrape les bugs "Dockerfile oublie un module" ─────
  # (comme le ModuleNotFoundError: 'http_client' qu'on a eu en v2.27.1 -> v2.27.2)
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t nexmove-ci api/

      - name: Run container (env minimal)
        run: |
          docker run -d --name nexmove-ci -p 8000:8000 \
            -e FORGE_NEX_API_KEY=ci-test-key \
            nexmove-ci
          # laisse le temps à uvicorn de démarrer (2 workers)
          for i in $(seq 1 20); do
            sleep 1
            if curl -sSf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "✅ /health répond après ${i}s"; exit 0
            fi
          done
          echo "❌ /health n'a jamais répondu — logs :"
          docker logs nexmove-ci --tail 80
          exit 1

      - name: Vérifier /health renvoie la bonne version
        run: |
          curl -s http://127.0.0.1:8000/health | tee /tmp/health.json
          test "$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['status'])")" = "ok"

      - name: Cleanup
        if: always()
        run: docker rm -f nexmove-ci || true

  # ─── Test du CHEMIN DE DÉPLOIEMENT RÉEL (audit N-03) ───────────────────────────────
  # docker-smoke construit l'image depuis api/ en direct. Or en production, deploy.sh
  # RECOPIE d'abord les fichiers vers un autre dossier : c'est cet écart qui a mis l'API
  # à terre en v3.96 (orientation.py absent de la liste copiée). Ce job rejoue la copie
  # puis construit l'image depuis le dossier synchronisé — le vrai chemin.
  deploy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Simuler un serveur de production
        run: |
          mkdir -p "$RUNNER_TEMP/prod/data"
          echo "FORGE_NEX_API_KEY=ci-test-key-assez-longue-pour-passer" > "$RUNNER_TEMP/prod/.env"
          printf 'services:\n  api:\n    build: .\n' > "$RUNNER_TEMP/prod/docker-compose.yml"

      - name: Rejouer la synchronisation de deploy.sh
        env:
          NEXMOVE_SKIP_GIT: "1"
          NEXMOVE_SKIP_BUILD: "1"
        run: |
          NEXMOVE_DEPLOY_DIR="$RUNNER_TEMP/prod" ./scripts/deploy.sh
          echo "— fichiers réellement déployés —"; ls -1 "$RUNNER_TEMP/prod"

      - name: Construire l'image depuis les fichiers DÉPLOYÉS
        run: docker build -t nexmove-deploy "$RUNNER_TEMP/prod"

      - name: L'API démarre-t-elle vraiment ?
        run: |
          docker run -d --name nexmove-deploy -p 8001:8000 \
            -e FORGE_NEX_API_KEY=ci-test-key-assez-longue-pour-passer nexmove-deploy
          for i in $(seq 1 20); do
            sleep 1
            if curl -sSf http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo "✅ /health répond après ${i}s (chemin de déploiement réel)"
              curl -s http://127.0.0.1:8001/health; exit 0
            fi
          done
          echo "❌ L'API déployée ne démarre pas — c'est la panne de la v3.96. Logs :"
          docker logs nexmove-deploy --tail 80
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f nexmove-deploy || true

  # ─── Failles connues dans les dépendances (audit A-07) ─────────────────────────────
  # Elles sont figées, ce qui est bien pour la reproductibilité — mais une version figée
  # vieillit : au 22/11/2026, l'audit a trouvé 68 failles, dont 55 dans Pillow (qui lit les
  # photos de CV envoyées par des inconnus) et 7 dans starlette (chaque requête HTTP).
  # Ce job échoue dès qu'une faille connue touche une dépendance de production.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Installer pip-audit
        run: python -m pip install --quiet --upgrade pip pip-audit
      - name: Auditer les dépendances de production
        run: pip-audit -r api/requirements.txt --progress-spinner off --strict
