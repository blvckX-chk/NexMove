<!doctype html>

<html lang="fr"><head><meta charset="utf-8">

<link rel="stylesheet" href="_base.css">
<style>
html,body{width:1080px;height:1080px}
.p{width:1080px;height:1080px}
.mark,.mark-slot{position:absolute;right:-40px;top:168px;height:338px;width:338px;z-index:1}
.mark{width:auto}
.head{position:absolute;left:84px;top:84px;right:84px;display:flex;align-items:baseline;justify-content:space-between;z-index:3}
.head .wm{font-size:56px}
.folio{font-size:20px;color:var(--mut)}
.rule{position:absolute;left:84px;top:170px;width:150px;z-index:3}
.tag{position:absolute;left:82px;top:338px;width:720px;font-size:104px;z-index:3}

.cats .a{color:var(--ambre)} .cats .b{color:var(--bleu3)} .cats .s{color:#3a4766}
.pill{position:absolute;left:84px;top:744px;display:flex;align-items:center;gap:18px;background:var(--nuit2);

.pill .t span{color:var(--mut);font-weight:400}
.pill .ic{display:flex;gap:10px;margin-left:4px}
.pill .ic div{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.badge{position:absolute;left:84px;top:862px;font-size:23px;padding:22px 44px;z-index:3}

.foot .hi{color:var(--off)} .foot .url{color:var(--vert)}

<div class="p">

      <div style="background:#25D366"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 3a9 9 0 0 0-7.7 13.6L3 21l4.5-1.2A9 9 0 1 0 12 3zm0 2a7 7 0 1 1-3.6 13l-.3-.2-2.3.6.6-2.2-.2-.3A7 7 0 0 1 12 5z"/></svg></div>
    </div>
